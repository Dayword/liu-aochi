# 码境 CodeRealm · Nginx 生产配置
#
# 用法：
#   1. 把本文件复制到 /etc/nginx/sites-available/code-adventurer
#   2. 改 server_name 为你自己的域名或公网 IP
#   3. ln -s /etc/nginx/sites-available/code-adventurer /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# 前端静态文件由本机 Nginx 直接返回，/api 反代到 127.0.0.1:8001 的 FastAPI。
# 这样浏览器与 API 同源，不用配 CORS，也不用管跨域 Cookie。

# ---- 限流区（Nginx 层兜底，应用内的滑动窗口是第二道闸门）----
# ⚠️ 这里按 IP 分桶，而校园网/宿舍 WiFi 下整个班共用一个出口 IP。
# 额度必须按「一个班 30~50 人」设计，不是按「一个人」：
#   600r/m ≈ 30 人 × 每人每分钟 20 次请求，burst=100 承受全班同时打开首页。
# 真正精细的「按用户 ID」限流在应用层（services/rate_limit.py），那层才是主力。
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=600r/m;
# 登录/注册接口单独收紧，防密码爆破。30 人同时登录是常态，故留 30 个突发。
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=120r/m;

upstream code_adventurer_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # __SERVER_NAME__ 由 deploy.sh 自动替换成你的域名（含 www）或公网 IP。
    # 手动部署时改成自己的即可，多个域名用空格分隔。
    server_name __SERVER_NAME__;

    # HTTPS 不写死在这里：由 `certbot --nginx -d 域名 -d www.域名` 自动追加
    # 443 server 块并把本块的 80 请求重定向过去，比手写证书路径更不容易出错
    # （续期时 certbot 也会自动改这份文件）。

    # 前端构建产物（npm run build 输出目录）
    root /var/www/code-adventurer/dist;
    index index.html;

    # 上传体积（目前没有文件上传接口，留一点余量即可）
    client_max_body_size 4m;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API 反向代理 ----
    location /api/ {
        limit_req zone=api_per_ip burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://code_adventurer_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # AI 推理接口单次可达数十秒（面试评分实测 13~17s），超时必须放宽
        proxy_connect_timeout 10s;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_buffering off;          # SSE 流式对话必须关闭缓冲
    }

    # 登录/注册单独限速
    location ~ ^/api/auth/(login|register|guest)$ {
        limit_req zone=auth_per_ip burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://code_adventurer_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 文档：对外想隐藏就整段注释掉
    location = /docs {
        proxy_pass http://code_adventurer_api/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://code_adventurer_api/openapi.json;
        proxy_set_header Host $host;
    }

    # ---- 前端静态资源 ----
    # 带 hash 的产物可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退：/learn、/profile 这些路径都要落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，避免用户拿到旧版本后一直白屏
        add_header Cache-Control "no-cache";
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # 代码沙箱超时后若产生大量日志，访问日志可关掉以省磁盘
    access_log /var/log/nginx/code-adventurer.access.log;
    error_log  /var/log/nginx/code-adventurer.error.log warn;
}
